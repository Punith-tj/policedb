<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Police Record Management System</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      background: linear-gradient(135deg, #0a1628 0%, #1e3a5f 50%, #0d1f3c 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .login-container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 420px;
      padding: 40px;
    }
    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .login-header .logo { font-size: 48px; margin-bottom: 12px; }
    .login-header h1 {
      font-size: 22px;
      color: var(--text-primary);
      font-weight: 700;
      margin-bottom: 4px;
    }
    .login-header p {
      color: var(--text-secondary);
      font-size: 14px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
    }
    .form-control {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-control:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
    }
    .btn-login {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 8px;
    }
    .btn-login:hover { background: var(--primary-hover); }
    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }

    .error-msg {
      background: var(--danger-light);
      color: #991b1b;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 16px;
      display: none;
    }
    .error-msg.visible { display: block; }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-header">
      <div class="logo">🚔</div>
      <h1>Police Record Management</h1>
      <p>Sign in to access the dashboard</p>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" class="form-control"
               placeholder="admin@police.gov.in" required autocomplete="email">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" class="form-control"
               placeholder="Enter your password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-login" id="loginBtn">Sign In</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // If already logged in, redirect to dashboard
    (async () => {
      const session = await getSession();
      if (session) {
        window.location.href = "pages/dashboard.html";
      }
    })();

    async function handleLogin(event) {
      event.preventDefault();
      const btn = document.getElementById("loginBtn");
      const errorDiv = document.getElementById("errorMsg");

      const email    = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      // Disable button during login attempt
      btn.disabled = true;
      btn.textContent = "Signing in...";
      errorDiv.classList.remove("visible");

      try {
        await login(email, password);
        window.location.href = "pages/dashboard.html";
      } catch (err) {
        errorDiv.textContent = err.message || "Login failed. Check your credentials.";
        errorDiv.classList.add("visible");
      } finally {
        btn.disabled = false;
        btn.textContent = "Sign In";
      }
    }
  </script>
</body>
</html>

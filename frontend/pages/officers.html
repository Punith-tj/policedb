<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Officers — Police DBMS</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/forms.css">
</head>
<body>
    <div class="app-container">
        <nav class="sidebar" id="sidebar"></nav>
        <div class="main-content">
            <header class="topbar" id="topbar"></header>
            <main class="content">
                <div class="page-header">
                    <h2>Police Officers</h2>
                    <button class="btn btn-primary" onclick="openAddModal()">＋ Add Officer</button>
                </div>

                <div class="filters-bar">
                    <input type="text" id="searchInput" class="search-input" placeholder="Search by name or designation..." oninput="filterOfficers()">
                    <select id="stationFilter" class="filter-select" onchange="filterOfficers()">
                        <option value="">All Stations</option>
                    </select>
                </div>

                <div class="card">
                    <div class="card-body" style="padding: 0;">
                        <div class="table-responsive">
                            <table class="data-table">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Officer Name</th>
                                        <th>Designation</th>
                                        <th>Contact</th>
                                        <th>Assigned Station</th>
                                        <th style="width: 140px;">Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="tableBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Add/Edit Officer Modal -->
    <div class="modal-overlay" id="formModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Add Officer</h3>
                <button class="modal-close" onclick="closeModal('formModal')">×</button>
            </div>
            <form id="officerForm" onsubmit="handleFormSubmit(event)">
                <div class="modal-body">
                    <div class="form-group">
                        <label for="officerName">Full Name *</label>
                        <input type="text" id="officerName" class="form-control" placeholder="e.g. Inspector Rajesh Kumar" required maxlength="100">
                    </div>
                    <div class="form-group">
                        <label for="designation">Designation *</label>
                        <select id="designation" class="form-control" required>
                            <option value="">Select Designation</option>
                            <option value="Inspector">Inspector</option>
                            <option value="Sub-Inspector">Sub-Inspector</option>
                            <option value="Assistant Sub-Inspector">Assistant Sub-Inspector</option>
                            <option value="Head Constable">Head Constable</option>
                            <option value="Constable">Constable</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="contactNumber">Contact Number *</label>
                        <input type="text" id="contactNumber" class="form-control" placeholder="e.g. 9876543201" required maxlength="15">
                    </div>
                    <div class="form-group">
                        <label for="stationId">Station *</label>
                        <select id="stationId" class="form-control" required>
                            <option value="">Select Police Station</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('formModal')">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="saveBtn">Save Officer</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal-overlay" id="deleteModal">
        <div class="modal modal-sm">
            <div class="modal-header">
                <h3>Confirm Deletion</h3>
                <button class="modal-close" onclick="closeModal('deleteModal')">×</button>
            </div>
            <div class="modal-body">
                <p>Are you sure you want to delete this officer record?</p>
                <p style="font-size: 12px; color: var(--danger); margin-top: 8px;">RESTRICT constraint: deletion will fail if this officer has assigned FIR cases or arrest records.</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closeModal('deleteModal')">Cancel</button>
                <button type="button" class="btn btn-danger" id="confirmDeleteBtn" onclick="confirmDelete()">Delete</button>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/config.js"></script>
    <script src="../js/supabase-client.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/pages/officers.js"></script>
</body>
</html>

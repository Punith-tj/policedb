<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Witnesses — Police DBMS</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/forms.css">
</head>
<body>
    <div class="app-container">
        <nav class="sidebar" id="sidebar"></nav>
        <div class="main-content">
            <header class="topbar" id="topbar"></header>
            <main class="content">
                <div class="page-header">
                    <h2>Witness Statements</h2>
                    <button class="btn btn-primary" onclick="openAddModal()">＋ Add Witness</button>
                </div>

                <div class="filters-bar">
                    <input type="text" id="searchInput" class="search-input" placeholder="Search by name, contact, FIR..." oninput="filterWitnesses()">
                    <select id="firFilter" class="filter-select" onchange="filterWitnesses()">
                        <option value="">All FIRs</option>
                    </select>
                </div>

                <div class="card">
                    <div class="card-body" style="padding: 0;">
                        <div class="table-responsive">
                            <table class="data-table">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Witness Name</th>
                                        <th>Age</th>
                                        <th>Contact Number</th>
                                        <th>Under FIR</th>
                                        <th style="width: 140px;">Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="tableBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="formModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Record Witness Statement</h3>
                <button class="modal-close" onclick="closeModal('formModal')">×</button>
            </div>
            <form id="witnessForm" onsubmit="handleFormSubmit(event)">
                <div class="modal-body">
                    <div class="form-group">
                        <label for="witnessName">Full Name *</label>
                        <input type="text" id="witnessName" class="form-control" placeholder="e.g. Shiva Prasad" required maxlength="100">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="age">Age * (Must be > 0)</label>
                            <input type="number" id="age" class="form-control" min="1" max="120" placeholder="e.g. 40" required>
                        </div>
                        <div class="form-group">
                            <label for="contactNumber">Contact Number</label>
                            <input type="text" id="contactNumber" class="form-control" placeholder="e.g. 9876001001" maxlength="15">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="firNumber">Under FIR *</label>
                        <select id="firNumber" class="form-control" required>
                            <option value="">Select FIR</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('formModal')">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="saveBtn">Save Witness</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Delete Modal -->
    <div class="modal-overlay" id="deleteModal">
        <div class="modal modal-sm">
            <div class="modal-header">
                <h3>Confirm Deletion</h3>
                <button class="modal-close" onclick="closeModal('deleteModal')">×</button>
            </div>
            <div class="modal-body">
                <p>Are you sure you want to delete this witness record?</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closeModal('deleteModal')">Cancel</button>
                <button type="button" class="btn btn-danger" id="confirmDeleteBtn" onclick="confirmDelete()">Delete</button>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/config.js"></script>
    <script src="../js/supabase-client.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/pages/witnesses.js"></script>
</body>
</html>

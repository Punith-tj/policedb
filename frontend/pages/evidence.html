<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evidence — Police DBMS</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/forms.css">
</head>
<body>
    <div class="app-container">
        <nav class="sidebar" id="sidebar"></nav>
        <div class="main-content">
            <header class="topbar" id="topbar"></header>
            <main class="content">
                <div class="page-header">
                    <h2>Evidence Catalog</h2>
                    <button class="btn btn-primary" onclick="openAddModal()">＋ Add Evidence</button>
                </div>

                <div class="filters-bar">
                    <input type="text" id="searchInput" class="search-input" placeholder="Search by type, description, FIR..." oninput="filterEvidence()">
                    <select id="firFilter" class="filter-select" onchange="filterEvidence()">
                        <option value="">All FIRs</option>
                    </select>
                </div>

                <div class="card">
                    <div class="card-body" style="padding: 0;">
                        <div class="table-responsive">
                            <table class="data-table">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Evidence Type</th>
                                        <th>Collection Date</th>
                                        <th>Associated FIR</th>
                                        <th>Description</th>
                                        <th style="width: 140px;">Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="tableBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="formModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Add Evidence Record</h3>
                <button class="modal-close" onclick="closeModal('formModal')">×</button>
            </div>
            <form id="evidenceForm" onsubmit="handleFormSubmit(event)">
                <div class="modal-body">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="evidenceType">Evidence Classification *</label>
                            <select id="evidenceType" class="form-control" required>
                                <option value="">Select Type</option>
                                <option value="Physical Evidence">Physical Evidence</option>
                                <option value="Digital Evidence">Digital Evidence</option>
                                <option value="CCTV Footage">CCTV Footage</option>
                                <option value="Documentary">Documentary</option>
                                <option value="Weapon">Weapon</option>
                                <option value="Medical Report">Medical Report</option>
                                <option value="Vehicle Part">Vehicle Part</option>
                                <option value="Forensic">Forensic</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="collectionDate">Collection Date *</label>
                            <input type="date" id="collectionDate" class="form-control" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="firNumber">Associated FIR *</label>
                        <select id="firNumber" class="form-control" required>
                            <option value="">Select FIR</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="description">Item Description & Chain of Custody Notes</label>
                        <textarea id="description" class="form-control" placeholder="Specify physical attributes, serial numbers, custody details..."></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('formModal')">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="saveBtn">Save Evidence</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Delete Modal -->
    <div class="modal-overlay" id="deleteModal">
        <div class="modal modal-sm">
            <div class="modal-header">
                <h3>Confirm Deletion</h3>
                <button class="modal-close" onclick="closeModal('deleteModal')">×</button>
            </div>
            <div class="modal-body">
                <p>Are you sure you want to delete this evidence record?</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closeModal('deleteModal')">Cancel</button>
                <button type="button" class="btn btn-danger" id="confirmDeleteBtn" onclick="confirmDelete()">Delete</button>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/config.js"></script>
    <script src="../js/supabase-client.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/pages/evidence.js"></script>
</body>
</html>
